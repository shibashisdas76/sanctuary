# Render Blueprint Infrastructure-as-Code Configuration
# Documentation: https://render.com/docs/blueprint-spec

services:
  # Web Service (100% Free Instance Plan)
  - type: web
    name: the-sanctuary
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: GEMINI_API_KEY
        sync: false
      - key: APP_URL
        value: https://the-sanctuary.onrender.com
