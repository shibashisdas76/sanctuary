# Render Blueprint Infrastructure-as-Code Configuration
# Documentation: https://render.com/docs/blueprint-spec

services:
  # Web Service (Node.js Express Server serving static dist + SPA fallback + Health checks)
  - type: web
    name: the-sanctuary
    runtime: node
    region: oregon
    plan: starter
    buildCommand: npm run build
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: GEMINI_API_KEY
        sync: false
      - key: APP_URL
        sync: false
